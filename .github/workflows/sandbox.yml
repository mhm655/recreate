name: sandbox

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Unit tests plus the hostile suite through LocalRunner (no isolation). Proves the
  # in-sandbox mechanics on Linux, independently of Docker and gVisor.
  local-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  # The real thing: gVisor-isolated containers with the production flags.
  gvisor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install gVisor (runsc)
        run: |
          set -euo pipefail
          ARCH=$(uname -m)
          URL=https://storage.googleapis.com/gvisor/releases/release/latest/${ARCH}
          cd "$(mktemp -d)"
          wget -q "${URL}/runsc" "${URL}/runsc.sha512" \
                  "${URL}/containerd-shim-runsc-v1" "${URL}/containerd-shim-runsc-v1.sha512"
          sha512sum -c runsc.sha512 -c containerd-shim-runsc-v1.sha512
          chmod a+rx runsc containerd-shim-runsc-v1
          sudo mv runsc containerd-shim-runsc-v1 /usr/local/bin/
          runsc --version

      - name: Register runsc with Docker (with OCI seccomp enforcement)
        run: |
          set -euo pipefail
          # Without --oci-seccomp, gVisor silently ignores docker/seccomp.json.
          CURRENT=$(sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}')
          echo "$CURRENT" \
            | jq '.runtimes.runsc = {"path": "/usr/local/bin/runsc", "runtimeArgs": ["--oci-seccomp"]}' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | jq .

      - run: npm ci
      - run: npm run build

      - name: Build sandbox image
        run: npm run image

      - name: Preflight
        run: node dist/src/cli.js preflight --runner docker

      - name: Verify isolation from inside the container
        run: node dist/src/cli.js verify-isolation

      - name: Example - well-behaved submission
        run: node dist/src/cli.js run --source examples/slugify.ts --tests examples/slugify.tests.json

      - name: Example - stateful submission (must be flagged NON-DETERMINISTIC)
        run: |
          set +e
          node dist/src/cli.js run --source examples/counter.ts --tests examples/counter.tests.json | tee counter.out
          grep -q 'verdict : NON-DETERMINISTIC' counter.out

      - name: Hostile suite against Docker + gVisor
        env:
          TSBOX_TEST_RUNNER: docker
        run: node --test --test-reporter=spec dist/test/hostile-pipeline.test.js
